{% extends 'base.html' %}{% block content %}<div class="container py-4"><h1>Availability</h1><form method="post" class="card p-3"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><select name="weekday">{% for i,n in [(0,'Monday'),(1,'Tuesday'),(2,'Wednesday'),(3,'Thursday'),(4,'Friday'),(5,'Saturday'),(6,'Sunday')] %}<option value="{{i}}">{{n}}</option>{% endfor %}</select><input type="time" name="start" required><input type="time" name="end" required><button>Add hours</button></form>{% for a in availability %}<p>{{a.weekday}}: {{a.start_time}}–{{a.end_time}} <form class="d-inline" method="post" action="{{url_for('delete_availability',avid=a.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button>Delete</button></form></p>{% endfor %}</div>{% endblock %}
