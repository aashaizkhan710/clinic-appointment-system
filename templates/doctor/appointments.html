{% extends 'base.html' %}{% block content %}<div class="container py-4"><h1>My schedule</h1>{% for a in appointments %}<div class="card p-3 my-2"><b>{{a.patient.name}}</b> — {{a.appointment_date}} {{a.start_time}} ({{a.status}}){% if a.status=='Pending' %}<form method="post" action="{{url_for('doctor_status',aid=a.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button name="status" value="Confirmed">Confirm</button><button name="status" value="Rejected">Reject</button></form>{% elif a.status=='Confirmed' %}<form method="post" action="{{url_for('doctor_status',aid=a.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input name="note" placeholder="Visit note"><button name="status" value="Completed">Complete</button><button name="status" value="No-show">No-show</button></form>{% endif %}</div>{% else %}<p>No appointments.</p>{% endfor %}</div>{% endblock %}
