{% extends 'base.html' %}{% block content %}<div class="container py-4"><div class="card p-4"><h1>Reschedule appointment</h1><p>{{appointment.doctor.user.name}} · {{appointment.appointment_date}} {{appointment.start_time.strftime('%H:%M')}}</p><form method="get"><input type="date" name="day" min="{{today}}" value="{{day}}"><button>Check date</button></form><hr><form method="post" action="{{url_for('reschedule',aid=appointment.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input type="hidden" name="day" value="{{day}}">{% for s in slots %}<button class="btn btn-success m-1" name="slot" value="{{s}}">{{s.strftime('%H:%M')}}</button>{% else %}<p>No free slots on this date.</p>{% endfor %}</form></div></div>{% endblock %}
