{% extends 'base.html' %}{% block content %}<div class="container py-4"><div class="card p-4"><h2>Book with {{doctor.user.name}}</h2><form method="get"><input type="date" name="day" value="{{day}}" min="{{today}}"><button>Check date</button></form><hr><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input type="hidden" name="day" value="{{day}}">{% for s in slots %}<button class="btn btn-outline-success m-1" name="slot" value="{{s}}">{{s.strftime('%H:%M')}}</button>{% else %}<p>No slots available.</p>{% endfor %}</form></div></div>{% endblock %}
