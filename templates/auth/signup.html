{% extends 'base.html' %}{% block content %}<div class="container py-5"><div class="card mx-auto p-4" style="max-width:520px"><h2>Create patient account</h2><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input class="form-control mb-2" name="name" placeholder="Full name" required><input class="form-control mb-2" name="phone" placeholder="Phone" required><input class="form-control mb-2" name="email" type="email" placeholder="Email" required><input class="form-control mb-2" name="password" type="password" placeholder="Password" required><input class="form-control mb-3" name="confirm" type="password" placeholder="Confirm password" required><button class="btn btn-success">Create account</button></form></div></div>{% endblock %}
