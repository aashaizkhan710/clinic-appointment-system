{% extends 'base.html' %}{% block content %}<div class="container py-4"><h1>All appointments</h1>{% for a in appointments %}<div class="card p-2 my-2">{{a.patient.name}} · {{a.doctor.user.name}} · {{a.appointment_date}} {{a.start_time}} · {{a.status}}{% if a.status in ['Pending','Confirmed'] %}<form method="post" class="d-inline" action="{{url_for('admin_cancel',aid=a.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button>Cancel</button></form>{% endif %}</div>{% endfor %}</div>{% endblock %}
