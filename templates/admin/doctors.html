{% extends 'base.html' %}{% block content %}<div class="container py-4"><h1>Manage doctors</h1><form method="post" class="card p-3"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input name="name" placeholder="Name"><input name="email" placeholder="Email"><input name="specialty" placeholder="Specialty"><button>Add doctor</button></form>{% for d in doctors %}<p>{{d.user.name}} — {{d.specialty}} — {{'Active' if d.active else 'Inactive'}} <form class="d-inline" method="post" action="{{url_for('doctor_toggle',did=d.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button>Toggle</button></form></p>{% endfor %}</div>{% endblock %}
