{% extends 'base.html' %}{% block content %}<div class="container py-4"><h1>Manage doctors</h1><form method="post" class="card p-3"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input name="name" placeholder="Name" required><input name="email" placeholder="Email" required><input name="specialty" placeholder="Specialty" required><button>Add doctor</button></form>{% for d in doctors %}<div class="card p-2 mt-3"><form method="post" action="{{url_for('doctor_edit',did=d.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input name="name" value="{{d.user.name}}"><input name="specialty" value="{{d.specialty}}"><button>Save</button></form>{{d.user.email}} — {{'Active' if d.active else 'Inactive'}} <form class="d-inline" method="post" action="{{url_for('doctor_toggle',did=d.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button>Toggle active</button></form></div>{% endfor %}</div>{% endblock %}
