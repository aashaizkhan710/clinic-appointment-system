<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nowshera Family Clinic</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="{{url_for('static',filename='css/style.css')}}" rel="stylesheet"></head><body><nav class="navbar navbar-expand-lg navbar-dark"><div class="container"><a class="navbar-brand" href="{{url_for('index')}}">Nowshera <b class="brand-mark">Family Clinic</b></a><div class="navbar-nav ms-auto">{% if current_user.is_authenticated %}<a class="nav-link" href="{{url_for('dashboard')}}">Dashboard</a><a class="nav-link" href="{{url_for('logout')}}">Logout</a>{% else %}<a class="nav-link" href="{{url_for('doctors')}}">Doctors</a><a class="nav-link" href="{{url_for('login')}}">Sign in</a>{% endif %}</div></div></nav>{% for c,m in get_flashed_messages(with_categories=true) %}<div class="container mt-3"><div class="alert alert-{{c}}">{{m}}</div></div>{% endfor %}<main>{% block content %}{% endblock %}</main><footer class="footer mt-5 py-4"><div class="container">Nowshera Family Clinic</div></footer></body></html>
